apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nfs-csi-driver
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  project: default
  source:
    repoURL: https://kubernetes-csi.github.io/csi-driver-nfs
    chart: csi-nfs-driver
    targetRevision: 4.13.4
    helm:
      values: |
        controller:
          replicas: 2

        storageClass:
          create: false

        externalSnapshotter:
          enabled: true

        namespace: kube-system
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true